<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Color Idioms: Sentence Challenge</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #121212;
            --panel-bg: #1e1e1e;
            --neon-blue: #3388ff;
            --neon-purple: #9933ff;
            --neon-green: #39ff14;
            --neon-red: #ff3333;
            --neon-yellow: #ffcc00;
            --text-main: #f5f5f5;
            --text-muted: #aaaaaa;
            --radius-lg: 8px; 
        }

        * {
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            margin: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
            background-image: 
              radial-gradient(circle at 15% 30%, rgba(51, 136, 255, 0.05), transparent 30%),
              radial-gradient(circle at 85% 70%, rgba(255, 51, 51, 0.05), transparent 30%);
        }

        #particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .header-banner {
            background-color: rgba(18, 18, 18, 0.95);
            border-bottom: 3px solid transparent;
            border-image: linear-gradient(to right, var(--neon-red), var(--neon-yellow), var(--neon-green), var(--neon-blue), var(--neon-purple)) 1;
            padding: 15px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
            z-index: 10;
        }

        .header-banner h1 {
            margin: 0;
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 5px var(--neon-blue);
        }

        .stats {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--neon-yellow);
        }

        #app-container {
            max-width: 800px;
            width: 100%;
            margin: 3rem auto;
            padding: 0 1rem;
            position: relative;
            z-index: 10;
        }

        .reading-container {
            background: var(--panel-bg);
            padding: 2.5rem;
            border-radius: var(--radius-lg);
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 1.5rem;
        }

        .action-btn {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            padding: 16px;
            background: transparent;
            border: 1px solid var(--text-main);
            border-radius: 4px;
            cursor: pointer;
            text-transform: lowercase;
            color: var(--text-main);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            width: 100%;
        }

        .action-btn:hover:not(:disabled) {
            background: var(--text-main);
            color: var(--bg-dark);
            transform: translateY(-2px);
        }

        .btn-correct { background-color: rgba(57, 255, 20, 0.2) !important; border-color: var(--neon-green) !important; color: var(--neon-green) !important; pointer-events: none;}
        .btn-wrong { background-color: rgba(255, 51, 51, 0.2) !important; border-color: var(--neon-red) !important; color: var(--neon-red) !important; pointer-events: none;}

        #sentence-zone {
            min-height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--neon-blue);
            border-radius: 8px;
            margin-bottom: 2rem;
            padding: 2rem;
        }

        .sentence-text {
            margin: 0;
            color: #fff;
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            line-height: 1.6;
        }

        .blank {
            color: var(--neon-yellow);
            border-bottom: 2px solid var(--neon-yellow);
            padding: 0 10px;
        }

        .correct-fill { color: var(--neon-green); font-weight: bold; }
        .wrong-fill { color: var(--neon-red); font-weight: bold; text-decoration: line-through; }

        @keyframes popIn {
            0% { transform: scale(0.98); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: popIn 0.4s ease-out forwards; }
        
        .start-screen h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--neon-blue);
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <canvas id="particles"></canvas>
    
    <header class="header-banner">
        <h1>Color Idioms // Masterclass</h1>
        <div class="stats">
            <span id="score-counter">🎯 Score: 0/0</span>
        </div>
    </header>
    
    <main id="app-container"></main>

    <script>
        // Particle Background
        function initParticles() {
            const canvas = document.getElementById('particles');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particlesArray = [];
            const colors = ['#ff3333', '#3388ff', '#ffcc00', '#39ff14', '#9933ff'];

            for (let i = 0; i < 40; i++) {
                particlesArray.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.5,
                    speedY: Math.random() * 0.5 - 0.25,
                    speedX: Math.random() * 0.5 - 0.25,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < particlesArray.length; i++) {
                    let p = particlesArray[i];
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    p.x += p.speedX; p.y += p.speedY;
                    if (p.x < 0) p.x = canvas.width;
                    if (p.x > canvas.width) p.x = 0;
                    if (p.y < 0) p.y = canvas.height;
                    if (p.y > canvas.height) p.y = 0;
                }
                requestAnimationFrame(animate);
            }
            animate();
        }

        // --- IDIOMS DATABASE ---
        const idiomsDB = [
            { idiom: "out of the blue", sentence: "I was playing football when __ my mom passed by and shouted at me." },
            { idiom: "once in a blue moon", sentence: "I live far away, so I only visit my old school __." },
            { idiom: "give the green light", sentence: "The principal finally decided to __ for our new science club." },
            { idiom: "a red flag", sentence: "His constant lying early in the relationship was definitely __." },
            { idiom: "red tape", sentence: "We had to deal with so much __ just to get our visas approved." },
            { idiom: "a white lie", sentence: "I didn't want to hurt her feelings about the bad haircut, so I told __." },
            { idiom: "a gray area", sentence: "Downloading that software is __ legally; it's not clearly allowed or forbidden." },
            { idiom: "green with envy", sentence: "When she saw my brand new smartphone, she was absolutely __." },
            { idiom: "see red", sentence: "Whenever my little brother breaks my things on purpose, it makes me __." },
            { idiom: "in the red", sentence: "If we keep spending more than we earn, our company will quickly be __." },
            { idiom: "in the black", sentence: "After months of hard work, the business is finally __ and making a profit." },
            { idiom: "catch red-handed", sentence: "The security guard managed to __ the thief taking items from the shelf." },
            { idiom: "black sheep", sentence: "As the only artist in a family of doctors, he often felt like the __." }
        ];

        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        const appContainer = document.getElementById('app-container');
        const scoreCounter = document.getElementById('score-counter');

        function init() {
            initParticles();
            renderStartScreen();
        }

        function renderStartScreen() {
            appContainer.innerHTML = `
                <div class="reading-container animate-pop start-screen">
                    <h2>Color Idioms Challenge</h2>
                    <p style="font-size: 1.2rem; color: var(--text-muted); margin-bottom: 2rem;">Read the sentence carefully and choose the correct color idiom to fill in the blank.</p>
                    <button class="action-btn" style="max-width: 300px; background: var(--neon-blue); border: none; color: #fff; text-transform: uppercase;" onclick="startGame()">Start Challenge</button>
                </div>
            `;
        }

        function startGame() {
            score = 0;
            currentIndex = 0;
            // Shuffle the database for random order
            currentQuestions = [...idiomsDB].sort(() => 0.5 - Math.random());
            updateScoreDisplay();
            renderQuestion();
        }

        function updateScoreDisplay() {
            scoreCounter.textContent = `🎯 Score: ${score}/${currentQuestions.length}`;
        }

        function renderQuestion() {
            if (currentIndex >= currentQuestions.length) {
                return renderEndScreen();
            }

            const q = currentQuestions[currentIndex];
            
            // Generate options (1 correct, 3 wrong)
            let options = [q.idiom];
            let wrongPool = idiomsDB.map(i => i.idiom).filter(i => i !== q.idiom);
            wrongPool.sort(() => 0.5 - Math.random());
            options.push(...wrongPool.slice(0, 3));
            options.sort(() => 0.5 - Math.random());

            appContainer.innerHTML = `
                <div class="reading-container animate-pop">
                    <div style="display:flex; justify-content:space-between; color:var(--text-muted); margin-bottom:1rem; font-size:0.9rem; font-weight: bold; text-transform: uppercase;">
                        <span>Question ${currentIndex + 1} of ${currentQuestions.length}</span>
                    </div>

                    <div id="sentence-zone">
                        <p class="sentence-text">${q.sentence.replace('__', '<span class="blank">__________</span>')}</p>
                    </div>

                    <h3 style="color: #fff; margin-bottom: 1.2rem; text-align: left;">Choose the correct idiom:</h3>

                    <div class="card-grid">
                        ${options.map(opt => `
                            <button class="action-btn" onclick="checkAnswer(this, '${opt.replace(/'/g, "\'")}', '${q.idiom.replace(/'/g, "\'")}')">"${opt}"</button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function checkAnswer(btn, selected, correct) {
            const allButtons = btn.parentElement.querySelectorAll('button');
            allButtons.forEach(b => b.style.pointerEvents = 'none'); // Disable clicks

            const sentenceZone = document.getElementById('sentence-zone');
            const q = currentQuestions[currentIndex];

            if (selected === correct) {
                btn.classList.add('btn-correct');
                score++;
                updateScoreDisplay();
                
                // Show correct sentence
                sentenceZone.innerHTML = `<p class="sentence-text">${q.sentence.replace('__', `<span class="correct-fill">${q.idiom}</span>`)}</p>`;
                sentenceZone.style.borderColor = "var(--neon-green)";
                sentenceZone.style.backgroundColor = "rgba(57, 255, 20, 0.05)";

                setTimeout(() => {
                    currentIndex++;
                    renderQuestion();
                }, 1500);

            } else {
                btn.classList.add('btn-wrong');
                
                // Show wrong feedback then reveal correct answer
                sentenceZone.innerHTML = `
                    <p class="sentence-text">${q.sentence.replace('__', `<span class="wrong-fill">${selected}</span>`)}</p>
                    <p class="sentence-text" style="margin-top: 15px; font-size: 1.4rem;">Correct: <span class="correct-fill">"${q.idiom}"</span></p>
                `;
                sentenceZone.style.borderColor = "var(--neon-red)";
                sentenceZone.style.backgroundColor = "rgba(255, 51, 51, 0.05)";

                // Highlight correct button
                allButtons.forEach(b => {
                    if (b.innerText.replace(/"/g, "") === correct) {
                        b.classList.add('btn-correct');
                    }
                });

                setTimeout(() => {
                    currentIndex++;
                    renderQuestion();
                }, 3000); // Give them time to read the correction
            }
        }

        function renderEndScreen() {
            let message = "";
            let color = "";
            const percentage = (score / currentQuestions.length) * 100;

            if (percentage >= 90) {
                message = "Exceptional! You passed with flying colors! 🌈";
                color = "var(--neon-green)";
            } else if (percentage >= 70) {
                message = "Great job! You're in the black! 📈";
                color = "var(--neon-blue)";
            } else {
                message = "Good try! Don't feel blue, practice makes perfect! 🔵";
                color = "var(--neon-yellow)";
            }

            appContainer.innerHTML = `
                <div class="reading-container animate-pop start-screen">
                    <h2 style="color: ${color};">${message}</h2>
                    <p style="font-size: 1.5rem; color: var(--text-main); margin: 2rem 0;">Final Score: <strong>${score} / ${currentQuestions.length}</strong></p>
                    <button class="action-btn" style="max-width: 300px; background: transparent; border-color: ${color}; color: ${color};" onclick="startGame()">Play Again</button>
                </div>
            `;
        }

        window.onload = init;
    </script>
</body>
</html>
