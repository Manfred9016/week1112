<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Psychology of Color - Interactive Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Colorful Psychology Theme */
            --bg-dark: #121212;
            --panel-bg: #1e1e1e;
            --neon-blue: #3388ff; /* Trust/Tech */
            --neon-purple: #9933ff; /* Luxury */
            --neon-pink: #ff3388;
            --neon-green: #39ff14; /* Nature/Growth */
            --neon-red: #ff3333; /* Energy/Fast Food */
            --neon-yellow: #ffcc00; /* Warmth */
            --text-main: #f5f5f5;
            --text-muted: #aaaaaa;
            --radius-lg: 8px; 
        }

        * {
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            margin: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
            background-image: 
              radial-gradient(circle at 15% 30%, rgba(51, 136, 255, 0.05), transparent 30%),
              radial-gradient(circle at 85% 70%, rgba(255, 51, 51, 0.05), transparent 30%),
              radial-gradient(circle at 50% 50%, rgba(255, 204, 0, 0.03), transparent 40%);
        }

        #particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .header-banner {
            background-color: rgba(18, 18, 18, 0.95);
            border-bottom: 3px solid transparent;
            border-image: linear-gradient(to right, var(--neon-red), var(--neon-yellow), var(--neon-green), var(--neon-blue), var(--neon-purple)) 1;
            padding: 15px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
            z-index: 10;
        }

        .header-banner h1 {
            margin: 0;
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 5px var(--neon-blue);
        }

        .stats {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-weight: bold;
            font-size: 1.2rem;
            font-family: 'Montserrat', sans-serif;
            color: var(--neon-yellow);
        }

        #app-container {
            max-width: 900px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
            position: relative;
            z-index: 10;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
        }

        .level-card {
            background: var(--panel-bg);
            border: 1px solid #333;
            border-radius: var(--radius-lg);
            padding: 2.2rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.35s ease;
            position: relative;
            overflow: hidden;
        }

        .level-card:hover {
            transform: translateY(-4px);
            border-color: var(--neon-blue);
            box-shadow: 0 5px 20px rgba(51, 136, 255, 0.15);
        }

        .level-card h2, .level-card h3 {
            font-family: 'Playfair Display', serif;
            color: var(--text-main);
            margin-top: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .level-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #444;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .action-btn {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            padding: 14px;
            background: transparent;
            border: 1px solid var(--text-main);
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            color: var(--text-main);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            width: 100%;
            margin-top: 1rem;
        }

        .action-btn:hover:not(:disabled) {
            background: var(--text-main);
            color: var(--bg-dark);
            border-color: var(--text-main);
            transform: translateY(-2px);
        }

        .btn-correct { background-color: rgba(57, 255, 20, 0.2) !important; border-color: var(--neon-green) !important; color: var(--neon-green) !important; }
        .btn-wrong { background-color: rgba(255, 51, 51, 0.2) !important; border-color: var(--neon-red) !important; color: var(--neon-red) !important; }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 2rem;
        }

        .reading-container {
            background: var(--panel-bg);
            padding: 2.2rem;
            border-radius: var(--radius-lg);
            border: 1px solid #333;
            margin-bottom: 2rem;
            line-height: 1.8;
            font-size: 1.1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .reading-container h2 {
            font-family: 'Playfair Display', serif;
            color: var(--neon-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .word-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 1.5rem;
            padding: 1.2rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #444;
            border-radius: 4px;
        }

        .cloud-word {
            background: var(--bg-dark);
            color: var(--text-main);
            padding: 6px 14px;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1px solid #555;
            transition: all 0.3s;
            text-transform: uppercase;
            border-radius: 4px;
        }

        .cloud-word.found {
            background: rgba(51, 136, 255, 0.2);
            color: var(--neon-blue);
            border-color: var(--neon-blue);
            text-decoration: line-through;
        }

        .interactive-word {
            cursor: pointer;
            padding: 0 2px;
            border-bottom: 1px dotted #888;
            transition: color 0.2s;
        }

        .interactive-word.revealed {
            color: var(--neon-yellow);
            font-weight: bold;
            border-bottom: none;
        }

        hr { border: 0; height: 1px; background: #333; margin: 1.8rem 0; }

        input[type="text"] {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            border: 1px solid #555;
            background: var(--bg-dark);
            color: var(--text-main);
            margin-top: 1rem;
            text-align: center;
            border-radius: 4px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--neon-blue);
        }

        .flashcard-scene {
            width: 100%;
            height: 360px;
            perspective: 1000px;
            margin: 1.8rem 0;
        }
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
        }
        .flashcard.is-flipped { transform: rotateY(180deg); }
        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--panel-bg);
            border: 1px solid #444;
            border-radius: var(--radius-lg);
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: var(--text-main);
            padding: 1.5rem;
            text-align: center;
        }
        .flashcard-back {
            transform: rotateY(180deg);
            background: var(--bg-dark);
            border-color: var(--neon-blue);
            justify-content: flex-start;
            overflow-y: auto;
        }

        .flashcard-examples {
            margin-top: 15px;
            font-size: 1.1rem;
            color: var(--text-main);
            text-align: left;
            width: 100%;
            border-top: 1px solid #333;
            padding-top: 15px;
            font-family: 'Montserrat', sans-serif;
        }

        .example-en { color: var(--neon-yellow); font-weight: bold; }
        .example-zh { color: var(--text-muted); font-size: 0.95rem; }

        .sentence-dropzone, .word-bank {
            min-height: 80px;
            border: 1px dashed #555;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: var(--bg-dark);
        }
        .draggable-word {
            padding: 10px 14px;
            background: var(--panel-bg);
            border: 1px solid #444;
            border-radius: 4px;
            color: var(--text-main);
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: bold;
            transition: transform 0.1s;
            user-select: none;
        }
        .draggable-word:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .ai-logo-frame {
            width: 180px;
            height: 180px;
            object-fit: contain;
            background: #ffffff;
            padding: 15px;
            border: 1px solid #333;
            border-radius: 50%;
            margin: 0 auto 1.5rem auto;
            display: block;
        }

        @keyframes popIn {
            0% { transform: scale(0.98); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: popIn 0.4s ease-out forwards; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }
        .shake { animation: shake 0.3s ease-in-out; }
    </style>
</head>

    <script>
        // Particle background logic for colors
        function initParticles() {
            const canvas = document.getElementById('particles');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particlesArray = [];
            const colors = ['#ff3333', '#3388ff', '#ffcc00', '#39ff14', '#9933ff'];

            for (let i = 0; i < 40; i++) {
                particlesArray.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.5,
                    speedY: Math.random() * 0.5 - 0.25,
                    speedX: Math.random() * 0.5 - 0.25,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < particlesArray.length; i++) {
                    let p = particlesArray[i];
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    
                    p.x += p.speedX;
                    p.y += p.speedY;

                    if (p.x < 0) p.x = canvas.width;
                    if (p.x > canvas.width) p.x = 0;
                    if (p.y < 0) p.y = canvas.height;
                    if (p.y > canvas.height) p.y = 0;
                }
                requestAnimationFrame(animate);
            }
            animate();
        }
        window.addEventListener('resize', () => {
            const canvas = document.getElementById('particles');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

               { section: "A Colorful World", text: "When you wake up in the morning, what is the first thing you see? You probably see the bright morning light, the white walls of your bedroom, or the blue sky outside your window. Colors are everywhere around us. They are in the clothes we wear, the food we eat, and the streets we walk on. For many of us, we do not think much about them. We just accept that a stop sign is red and the ocean is blue. However, colors are not just simple decorations. They do much more than make things look pretty. Colors can change the way we act. They can make us feel happy, sad, hungry, or sleepy. Without us even knowing it, the colors in our world are quietly speaking to our brains." },
               { section: "What Is Color Psychology?", text: "This brings us to a very interesting idea called color psychology. What exactly does this mean? Psychology is the study of the human mind and how we behave. So, color psychology is the study of how different colors affect our feelings and our actions. It asks questions about why certain colors make us feel safe while other colors make us feel excited. Scientists and thinkers have studied this for many years. They want to know if looking at a yellow wall makes people smile more than looking at a gray wall. They also want to understand why we choose to buy one product instead of another just because of its color. Of course, color psychology is not magic. It cannot force you to do something you do not want to do. But it can gently push your feelings in a certain direction." },

               { section: "The Face of a Brand", text: "Because colors can change our choices, businesses pay close attention to them. Companies want you to buy their products. They also want you to trust them and remember them. This is why companies are very careful when they choose the colors for their logos. A logo is the special picture or design that a company uses as its face. Think about a famous fast-food company like McDonald's. Their logo uses bright red and yellow. Why did they choose these colors? Red is full of energy and can make people feel hungry. Yellow is happy and easy to see from far away. Together, these colors invite you to come inside, eat quickly, and feel cheerful. Now, think about a big technology company or a bank, like Facebook. They almost always use blue in their logos. They do not want you to feel excited or hungry. They want you to feel that your information and your money are safe. Blue tells consumers that they can trust the company." },

               { section: "Colors Around the World", text: "However, the meaning of a color is not the same everywhere you go. Our world is very big, and it is full of different cultures and histories. A color that means something good in one country might mean something bad in another country. Let us look at the color white. In many Western countries, like the United States, white is the color of peace and purity. People often wear white at happy events like weddings. But in many Eastern countries, including places in Asia, white is often worn at sad events, like funerals, to remember people who have passed away. Red is another great example. In Western countries, it can mean love or danger. But in Taiwan, red is a very lucky color. It means good fortune, joy, and wealth. This is why red envelopes are given during the Lunar New Year. Companies that sell products around the world must be very careful to learn about these cultural differences." },
               { section: "We Are All Different", text: "Even within the same culture, color psychology is not a strict set of rules. You cannot say that blue will always make every single person feel calm. We are all humans, but we are all unique. Our personal experiences change how we see the world. If you were bitten by a dog when you were wearing a yellow shirt, you might not like the color yellow very much. It might make you feel nervous instead of happy. If your favorite grandmother always drove a green car, you might feel a special kind of love and safety whenever you see that shade of green. Color psychology shows us common patterns in how people feel, but it is not a perfect science. The same color does not make everyone feel the same way. We must remember that our own minds and memories add extra meaning to the colors we see." },

        // --- APPLICATION LOGIC ---

        // --- ACTIVITY 1: READING WITH PAGINATION ---
        function startReading() {

        function renderReading() {
            wordsToFind = currentLevel.vocabulary.map(v => v.word.toLowerCase());
            const cloudHTML = currentLevel.vocabulary.map(v => 
                `<span class="cloud-word" id="cloud-${v.word.replace(/\s+/g, '-').toLowerCase()}">${v.word}</span>`
            ).join('');

            const isFirst = currentReadingIndex === 0;
            const isLast = currentReadingIndex === currentLevel.reading.length - 1;
            const currentPassage = currentLevel.reading[currentReadingIndex];

            // Replaces word to allow clicking. Avoids matching inside HTML tags.
            const interactiveText = currentPassage.text.replace(/(?<!<[^>]*)([a-zA-Z0-9-]+)(?![^<]*>)/g, '<span class="interactive-word" onclick="checkWord(this)">$1</span>');

            appContainer.innerHTML = `
                <button class="action-btn" style="width:auto; margin-bottom: 1rem;" onclick="renderMenu()">← Back to Hub</button>
                <div class="reading-container animate-pop">
                    <div style="display:flex; justify-content:space-between; color:var(--text-muted); margin-bottom:1rem; font-size: 0.9rem;">

                        }

        function navigateReading(direction) {
            currentReadingIndex += direction;
            renderReading();
        }

        function checkWord(element) {
            const clickedWord = element.innerText.toLowerCase().trim();
            const matchedVocab = wordsToFind.find(word => {
                if (word === clickedWord) return true;
                const phraseWords = word.split(' ');
                return phraseWords.includes(clickedWord);
            });

            if (matchedVocab) {
                element.classList.add('revealed');
                const cloudEl = document.getElementById(`cloud-${matchedVocab.replace(/\s+/g, '-')}`);
                if (cloudEl && !cloudEl.classList.contains('found')) {
                    cloudEl.classList.add('found');
                    updateXP(5);
                }
            } else {
                element.classList.add('shake');
                setTimeout(() => element.classList.remove('shake'), 400);
            }
        }

        // --- ACTIVITY 2: QUIZ ---
        function startQuiz() {
            if(currentLevel.questions.length === 0) {
                alert("Quiz coming soon for this level!");
                return;
            }
            currentQuestionIndex = 0;
            renderQuiz();
        }

        function renderQuiz() {
            const qData = currentLevel.questions[currentQuestionIndex];
            const isLast = currentQuestionIndex === currentLevel.questions.length - 1;
            const isFirst = currentQuestionIndex === 0;
            let interactionHTML = '';
            
            if (qData.type === 'mc') {
                interactionHTML = `
                    <div id="mc-options" style="display:flex; flex-direction:column; gap:10px; margin-top: 1.5rem;">
                        ${qData.options.map((opt, index) => `
                            <button class="action-btn" style="text-align: left; text-transform:none; padding:1rem;" 
                            onclick="checkQuizAnswer(this, ${index}, ${qData.answer}, 'mc')">${opt}</button>
                        `).join('')}
                    </div>`;
            } else if (qData.type === 'fill') {
                interactionHTML = `
                    <div style="margin-top: 1.5rem;">
                        <input type="text" id="fill-input" placeholder="Type answer here..." autocomplete="off">
                        <button class="action-btn" style="margin-top:1rem;" onclick="checkQuizAnswer(document.getElementById('fill-input'), null, '${qData.answer}', 'fill')">Submit Answer</button>
                    </div>`;
            }

            appContainer.innerHTML = `
                <button class="action-btn" style="width:auto; margin-bottom: 1rem;" onclick="renderMenu()">← Back to Hub</button>
                <div class="reading-container animate-pop">
                    <div style="display:flex; justify-content:space-between; color:var(--text-muted); margin-bottom:1rem; font-size: 0.9rem;">
                        <span>QUESTION ${currentQuestionIndex + 1} OF ${currentLevel.questions.length}</span>
                    </div>
                    <p style="font-size: 1.25rem; font-weight: bold; color: var(--text-main); line-height:1.5;">${qData.q}</p>
                    ${interactionHTML}
                    
                    <div class="nav-buttons">
                        <button class="action-btn" style="width:48%;" onclick="navigateQuiz(-1)" ${isFirst ? 'disabled style="opacity:0.5"' : ''}>Previous</button>
                        <button class="action-btn" style="width:48%;" onclick="navigateQuiz(1)">${isLast ? 'Finish' : 'Next'}</button>
                    </div>
                </div>
            `;
        }

        function checkQuizAnswer(element, selectedIndex, correctAnswer, type) {
            if (type === 'mc') {
                const allButtons = element.parentElement.querySelectorAll('button');
                allButtons.forEach(btn => btn.style.pointerEvents = 'none');

                if (selectedIndex === correctAnswer) {
                    element.classList.add('btn-correct');
                    updateXP(15);
                } else {
                    element.classList.add('btn-wrong');
                    element.classList.add('shake');
                    allButtons[correctAnswer].classList.add('btn-correct');
                }
            } else if (type === 'fill') {
                const userAnswer = element.value.trim().toLowerCase();
                const actualAnswer = correctAnswer.toLowerCase();
                if (userAnswer.includes(actualAnswer) || actualAnswer.includes(userAnswer)) {
                    element.style.borderColor = 'var(--neon-green)';
                    element.style.color = 'var(--neon-green)';
                    updateXP(15);
                    alert("Correct!");
                } else {
                    element.style.borderColor = 'var(--neon-red)';
                    element.classList.add('shake');
                    setTimeout(() => element.classList.remove('shake'), 400);
                }
            }
        }

        function navigateQuiz(direction) {
            currentQuestionIndex += direction;
            if (currentQuestionIndex >= currentLevel.questions.length) {
                alert("Knowledge Check Completed!");
                renderMenu();
            } else {
                renderQuiz();
            }
        }

        // --- ACTIVITY 4: UNSCRAMBLE VOCAB ---
        function startVocabUnscramble() {
            if(currentLevel.unscrambleWords.length === 0) {
                alert("Unscramble coming soon!");
                return;
            }
            currentVocabUnscrambleIndex = 0;
            renderVocabUnscramble();
        }

        function scrambleString(str) {
            let arr = str.split('');
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            let scrambled = arr.join('');
            if (scrambled === str && str.length > 3) return scrambleString(str);
            return scrambled;
        }

        function renderVocabUnscramble() {
            const wordsList = currentLevel.unscrambleWords;
            const originalWord = wordsList[currentVocabUnscrambleIndex];
            const scrambledWord = scrambleString(originalWord);
            
            appContainer.innerHTML = `
                <button class="action-btn" style="width:auto; margin-bottom: 1rem;" onclick="renderMenu()">← Back to Hub</button>
                <div class="reading-container animate-pop" style="text-align:center;">

            const sentencesList = currentLevel.sentences;
            const sentence = sentencesList[currentSentenceIndex];

            let scrambledWords = [...words];
            for (let i = scrambledWords.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [scrambledWords[i], scrambledWords[j]] = [scrambledWords[j], scrambledWords[i]];

            ).join('');

            appContainer.innerHTML = `
                <button class="action-btn" style="width:auto; margin-bottom: 1rem;" onclick="renderMenu()">← Back to Hub</button>

                return renderMenu();

            const currentMission = activeMissions[missionChallengeIndex];
            
            let options = [currentMission.name];
            let pool = ALL_MISSIONS.filter(name => name !== currentMission.name);
            pool.sort(() => 0.5 - Math.random());
            options.push(...pool.slice(0, 3));
            options.sort(() => 0.5 - Math.random()); 

            appContainer.innerHTML = `

            } else {
                btn.classList.add('btn-wrong');
                const feedbackZone = document.getElementById('mission-feedback-zone');
                feedbackZone.innerHTML = `
                    <div style="color: var(--neon-red); font-size: 1.3rem; font-weight: bold; margin: 2rem 0; font-family: 'Playfair Display', serif;">
                        Incorrect! This matches ${correct}.
                    </div>`;
                setTimeout(() => {
                    missionChallengeIndex++;
                    renderMissionChallenge(); 
                }, 2000);
            }
        }

        // --- ACTIVITY 7: IDIOM DECODE CHALLENGE ---
        function startAppChallenge() {
            appChallengeIndex = 0;
            activeSpaceApps = [...idiomAppsDB].sort(() => 0.5 - Math.random());
            renderAppChallenge();
        }

        function renderAppChallenge() {
            if (appChallengeIndex >= activeSpaceApps.length) {
                alert("Idiom Challenge Complete!");
                return renderMenu();
            }

            const currentApp = activeSpaceApps[appChallengeIndex];
            
            let options = [currentApp.meaning];
            let pool = ALL_IDIOM_MEANINGS.filter(m => m !== currentApp.meaning);
            pool.sort(() => 0.5 - Math.random());
            options.push(...pool.slice(0, 3));
            options.sort(() => 0.5 - Math.random()); 

            appContainer.innerHTML = `
                <button class="action-btn" style="width:auto; margin-bottom: 1rem;" onclick="renderMenu()">← Back to Hub</button>
                <div class="reading-container animate-pop" style="padding-bottom: 1.5rem; text-align: center;">
                    <div style="display:flex; justify-content:space-between; color:var(--text-muted); margin-bottom:1rem; font-size:0.9rem;">
                        <span>IDIOM ${appChallengeIndex + 1} OF ${activeSpaceApps.length}</span>
                    </div>

                    <div id="app-feedback-zone" style="min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--neon-blue); border-radius: 8px; margin-bottom: 1.8rem; padding: 1.5rem;">
                        <span style="font-size: 4rem; user-select: none; margin-bottom: 15px;">${currentApp.emoji}</span>
                        <h2 style="margin: 0; color: var(--neon-yellow); font-family: 'Playfair Display', serif; text-transform: lowercase;">"${currentApp.idiom}"</h2>
                    </div>

                    <h3 style="color: #fff; margin-bottom: 1.2rem;">What does this idiom mean?</h3>

                    <div class="card-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                        ${options.map(opt => `
                            <button class="action-btn" style="margin-top: 0; padding: 1.1rem 0.6rem; font-size: 0.9rem; line-height: 1.3;" onclick="checkAppGuess(this, '${opt.replace(/'/g, "\'")}', '${currentApp.meaning.replace(/'/g, "\'")}')">${opt}</button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function checkAppGuess(btn, selected, correct) {
            const allButtons = btn.parentElement.querySelectorAll('button');
            allButtons.forEach(b => b.style.pointerEvents = 'none');

            if (selected === correct) {
                btn.classList.add('btn-correct');
                updateXP(20);
                setTimeout(() => {
                    appChallengeIndex++;
                    renderAppChallenge();
                }, 1000);
            } else {
                btn.classList.add('btn-wrong');
                const feedbackZone = document.getElementById('app-feedback-zone');
                feedbackZone.innerHTML = `
                    <span style="display: block; color: var(--neon-red); font-size: 1.2rem; font-weight: bold; margin: 1.5rem 0; font-family: 'Playfair Display', serif;">
                        Incorrect! It means: ${correct}.
                    </span>`;
                setTimeout(() => {
                    appChallengeIndex++;
                    renderAppChallenge(); 
                }, 2000);
            }
        }

        // --- ACTIVITY 8: SYNONYM MATCH CHALLENGE ---
        function startSynonymMatch() {
            if (!currentLevel.synonyms || currentLevel.synonyms.length === 0) {
                alert("No synonyms available for this level.");
                return;
            }
            synonymChallengeIndex = 0;
            activeSynonyms = [...currentLevel.synonyms].sort(() => 0.5 - Math.random());
            renderSynonymMatch();
        }

        function renderSynonymMatch() {
            if (synonymChallengeIndex >= activeSynonyms.length) {
                alert("Synonym Challenge Complete. (+50 MP Bonus)");
                updateXP(50);
                return renderMenu();
            }

            const currentPair = activeSynonyms[synonymChallengeIndex];
            
            let options = [currentPair.synonym];
            let pool = currentLevel.synonyms
                .map(s => s.synonym)
                .filter(syn => syn !== currentPair.synonym);
            
            pool.sort(() => 0.5 - Math.random());
            options.push(...pool.slice(0, 3));
            options.sort(() => 0.5 - Math.random());

            appContainer.innerHTML = `
                <button class="action-btn" style="width:auto; margin-bottom: 1rem;" onclick="renderMenu()">← Back to Hub</button>
                <div class="reading-container animate-pop" style="padding-bottom: 1rem; text-align: center;">
                    <div style="display:flex; justify-content:space-between; color:var(--text-muted); margin-bottom:1rem; font-size:0.9rem;">
                        <span>SYNONYM ${synonymChallengeIndex + 1} OF ${activeSynonyms.length}</span>
                    </div>

                    <h2 style="color: #fff; margin-bottom: 0.5rem;">Find the closest synonym for:</h2>
                    
                    <div style="background: rgba(255, 255, 255, 0.05); padding: 1.8rem; border-radius: 4px; margin-bottom: 2rem; border: 1px dotted #666; text-align: center;">
                        <strong style="color: var(--neon-blue); font-family: 'Playfair Display', serif; font-size: 2.2rem; letter-spacing: 2px; text-transform: uppercase;">
                            ${currentPair.word}
                        </strong>
                    </div>

                    <div class="card-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                        ${options.map(opt => `
                            <button class="action-btn" style="margin-top: 0; padding: 1.2rem; font-size: 1.05rem;" onclick="checkSynonymGuess(this, '${opt}', '${currentPair.synonym}')">${opt}</button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function checkSynonymGuess(btn, selected, correct) {
            const allButtons = btn.parentElement.querySelectorAll('button');
            allButtons.forEach(b => b.style.pointerEvents = 'none');

            if (selected === correct) {
                btn.classList.add('btn-correct');
                updateXP(15);
                setTimeout(() => {
                    synonymChallengeIndex++;
                    renderSynonymMatch();
                }, 1000);
            } else {
                btn.classList.add('btn-wrong');
                btn.classList.add('shake');
                
                allButtons.forEach(b => {
                    if (b.innerText === correct) {
                        b.classList.add('btn-correct');
                    }
                });

                setTimeout(() => {
                    synonymChallengeIndex++;
                    renderSynonymMatch(); 
                }, 2000);
            }
        }

        // Initialize application on load
        init();
    </script>
</body>
</html>
